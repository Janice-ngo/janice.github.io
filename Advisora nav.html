<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advisora — Navbar</title>
<style>
/* ==========================================================================
   Self-hosted Inter
   NOTE: no network access was available to fetch the real Inter binaries,
   so these two @font-face blocks point at local files that don't exist yet.
   Drop real Inter woff2 files at ./fonts/inter-latin.woff2 and
   ./fonts/inter-latin-ext.woff2 (or point src at wherever your project
   already keeps them) and this activates automatically — the fallback
   stack below keeps things readable in the meantime.
   ========================================================================== */
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url('fonts/inter-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url('fonts/inter-latin-ext.woff2') format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}

* {
  box-sizing: border-box;
}
html {
  font-size: calc(0.5991091314031181rem + 0.4454342984409799vw);
}
@media screen and (max-width: 1440px) { html { font-size: calc(0.5991091314031181rem + 0.4454342984409799vw); } }
@media screen and (max-width: 991px)  { html { font-size: calc(0.44698660714285715rem + 0.8928571428571428vw); } }
@media screen and (max-width: 767px)  { html { font-size: calc(0.6671006944444444rem + 0.6944444444444444vw); } }
@media screen and (max-width: 479px)  { html { font-size: calc(0.7494769874476988rem + 0.8368200836820083vw); } }

:root {
  --bg-color--bg-secondary: var(--brand--neutral-light);
  --text-color--text-primary: var(--brand--black);
  --text-color--text-secondary: var(--brand--neutral);
  --brand--primary: #083630;
  --bg-color--bg-primary: var(--brand--neutral-lighter);
  --brand--soft-white: #fffc;
  --brand--neutral-light: #dad6c9;
  --brand--gray: #787878;
  --border-color--border-primary: #efeff2;
  --brand--neutral-lighter: #efeeeb;
  --bg-color--bg-tertiary: var(--brand--neutral-dark);
  --brand--white: #fff;
  --brand--secondary: #fb4d17;
  --brand--black: #000;
  --bg-color--bg-alternate: var(--brand--primary);
  --brand--neutral-dark: #111;
  --brand--primary-light: #1f514a;
}

html, body {
  margin: 0;
  min-height: 100%;
}
body {
  background: var(--bg-color--bg-secondary);
  color: var(--text-color--text-primary);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: .875rem;
  line-height: 1.42;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior: none;
  min-height: 100svh;
}
img { max-width: 100%; display: inline-block; vertical-align: middle; }
a { color: inherit; font-size: 1rem; text-decoration: none; }
button { cursor: pointer; border: 0; background: transparent; font: inherit; color: inherit; }

.page-wrapper {
  padding: .75rem;
  overflow: visible; /* visible (not clip) so the expanded hamburger card isn't cut off in this standalone demo */
}

/* ---------- layout / tokens shared with the rest of the site ---------- */
.padding-global { padding-left: 3.62rem; padding-right: 3.62rem; }
.padding-global.is-navbar { padding-top: 1rem; padding-bottom: 1rem; }

.navbar {
  background-color: var(--bg-color--bg-primary);
  color: #131313;
  border-radius: .5rem;
  width: 100%;
  margin-bottom: 1rem;
}
.navbar_content {
  justify-content: space-between;
  align-items: center;
  display: flex;
}
.navbar_logo-link {
  justify-content: flex-start;
  align-items: center;
  padding-left: 0;
  padding-right: 0;
  display: flex;
  position: relative;
}
.navbar_logo { width: 8rem; height: auto; }

.nav_wrap {
  gap: 1.75rem;
  justify-content: center;
  align-items: center;
  display: flex;
}
.nav_mobile {
  justify-content: center;
  align-items: center;
  display: flex;
}
.navbar_list {
  gap: 1.25rem;
  justify-content: center;
  align-items: center;
  display: flex;
}
.nav_links {
  gap: .5rem;
  justify-content: center;
  align-items: center;
  padding: .75rem;
  font-size: 1rem;
  font-weight: 500;
  line-height: 1.5;
  display: flex;
}

.nav_buttons-wrap {
  gap: 1.25rem;
  justify-content: flex-start;
  align-items: center;
  display: flex;
}
.login-wrap {
  gap: 1rem;
  justify-content: center;
  align-items: center;
  display: flex;
}

/* ---------- primary button (Contact) — hover: text shifts right ---------- */
.button {
  background-color: var(--bg-color--bg-tertiary);
  min-height: 3.25rem;
  color: var(--brand--white);
  text-align: center;
  letter-spacing: -.008em;
  border-radius: .5rem;
  justify-content: center;
  align-items: center;
  padding: .25rem 1.5rem;
  font-size: 1rem;
  font-weight: 500;
  line-height: 1.3;
  transition: transform .3s;
  display: flex;
}
.button:hover { transform: scale(.975); }
.button.is-primary {
  position: relative;
  gap: 0.5rem;
  background-color: var(--brand--secondary);
  align-items: stretch;
  padding-top: 0;
  padding-bottom: 0;
  overflow: clip;
}
.button-text-wrap {
  flex-flow: column;
  justify-content: flex-start;
  place-items: center;
  display: flex;
  position: relative;
  overflow: clip;
}
.button-text {
  letter-spacing: -.008em;
  flex: 0 0 100%;
  justify-content: center;
  align-items: center;
  font-size: 1rem;
  display: flex;
}
.button-text.is-second { transform: translate(0, 50%); }
.button-shadow-up {
  background-image: linear-gradient(180deg, var(--brand--secondary), #fff0);
  height: 30%;
  position: absolute;
  inset: 0% 0% auto;
}
.button-shadow-down {
  background-image: linear-gradient(0deg, var(--brand--secondary), #fff0);
  height: 30%;
  position: absolute;
  inset: auto 0% 0%;
}
.button-icon {
  display: block;
  width: 1.125rem;
  height: 1.125rem;
  margin: 0;
  flex: none;
  align-self: center;
}

/* ---------- visibility helpers ---------- */
@media (max-width: 991px) { .is-desktop-only { display: none !important; } }
@media (min-width: 992px) { .is-mobile-only  { display: none !important; } }

/* ---------- OSMO scaling-hamburger nav (tablet + mobile) ---------- */
.hamburger-anchor {
  position: relative;
  width: 2.75em;
  height: 2.75em;
  font-size: 1rem;
  overflow: visible;
  flex-shrink: 0;
}
.hamburger-nav {
  border-radius: .5rem;
  position: absolute;
  top: 0;
  right: 0;
  font-size: 1rem;
}
.hamburger-nav__bg {
  transition: all .3s cubic-bezier(.5,.5,0,1);
  background-color: var(--brand--secondary);
  border-radius: .375rem;
  width: 2.75em;
  height: 2.75em;
  position: absolute;
  top: 0;
  right: 0;
}
[data-navigation-status="active"] .hamburger-nav__bg {
  width: 100%;
  height: 100%;
  border-radius: .5rem;
}
.hamburger-nav__group {
  transition: opacity .2s cubic-bezier(.5,.5,0,1), transform .3s cubic-bezier(.5,.5,0,1), visibility .3s cubic-bezier(.5,.5,0,1);
  gap: 1em;
  pointer-events: auto;
  transform-origin: 100% 0;
  flex-flow: column;
  padding: 2.25em 2.5em 2em 2em;
  display: flex;
  position: relative;
  transform: scale(.15);
  opacity: 0;
  visibility: hidden;
}
[data-navigation-status="active"] .hamburger-nav__group {
  transform: scale(1);
  opacity: 1;
  visibility: visible;
}
.hamburger-nav__menu-p {
  opacity: .55;
  letter-spacing: .1em;
  text-transform: uppercase;
  margin: 0;
  color: var(--brand--white);
  font-size: .75em;
  font-weight: 500;
}
.hamburger-nav__ul {
  gap: .375em;
  flex-flow: column;
  margin: 0;
  padding: 0;
  display: flex;
  position: relative;
  list-style: none;
}
.hamburger-nav__li { margin: 0; padding: 0; list-style: none; }
.hamburger-nav__a {
  color: var(--brand--white);
  justify-content: space-between;
  align-items: center;
  text-decoration: none;
  display: flex;
}
.hamburger-nav__p {
  white-space: nowrap;
  margin: 0;
  padding-right: 1.25em;
  color: inherit;
  font-size: 1.75em;
  font-weight: 500;
  line-height: 1.15;
}
.hamburger-nav__dot {
  background-color: currentColor;
  border-radius: 50%;
  flex-shrink: 0;
  width: .5em;
  height: .5em;
  opacity: .25;
}

.hamburger-nav__toggle {
  transition: transform .3s cubic-bezier(.5,.5,0,1);
  pointer-events: auto;
  cursor: pointer;
  border: none;
  background: transparent;
  border-radius: .5rem;
  justify-content: center;
  align-items: center;
  width: 2.75em;
  height: 2.75em;
  display: flex;
  position: absolute;
  top: 0;
  right: 0;
  padding: 0;
  transform: translate(0, 0);
}
[data-navigation-status="active"] .hamburger-nav__toggle { transform: translate(-1em, 1em); }
.hamburger-nav__toggle-bar {
  transition: transform .3s cubic-bezier(.5,.5,0,1);
  background-color: var(--brand--white);
  width: 40%;
  height: .125em;
  position: absolute;
  transform: translateY(-.15em);
}
[data-navigation-status="active"] .hamburger-nav__toggle .hamburger-nav__toggle-bar { transform: translateY(0) rotate(45deg); }
.hamburger-nav__toggle .hamburger-nav__toggle-bar:nth-child(2) { transform: translateY(.15em); }
[data-navigation-status="active"] .hamburger-nav__toggle .hamburger-nav__toggle-bar:nth-child(2) { transform: translateY(0) rotate(-45deg); }

@media (max-width: 479px) {
  .hamburger-nav__p { font-size: 1.5em; }
  .hamburger-nav__group { padding: 2em 2.25em 1.75em 1.75em; }
}

@media screen and (max-width: 991px) {
  .padding-global { padding-left: 2.25rem; padding-right: 2.25rem; }
  .nav_mobile {
    text-align: left;
    flex-flow: row;
    justify-content: flex-end;
    align-items: stretch;
    min-width: auto;
    position: absolute;
    inset: 110% 0 0%;
  }
  .navbar { border: 1px solid #0000001f; }
}
@media screen and (max-width: 767px) {
  .padding-global { padding-left: 1rem; padding-right: 1rem; }
  .padding-global.is-navbar { padding-left: 1.5rem; }
  .navbar { border-width: 0; border-radius: .375rem; }
  .navbar_logo { width: 7rem; }
}
@media screen and (max-width: 479px) {
  .padding-global.is-navbar { padding-top: .75rem; padding-bottom: .75rem; }
  .navbar_content { padding-left: 0; }
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
  <div class="page-wrapper">
    <div role="banner" class="navbar">
      <div class="padding-global is-navbar">
        <div class="navbar_content">
          <a href="/" aria-label="Advisora — Home" class="navbar_logo-link">
            <svg class="navbar_logo" viewBox="0 0 128 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Advisora">
              <text x="0" y="22" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="currentColor">Advisora</text>
            </svg>
          </a>

          <div class="nav_wrap is-desktop-only">
            <nav role="navigation" aria-label="Primary" class="nav_mobile">
              <div class="navbar_list">
                <a href="/about" class="nav_links">About</a>
                <a href="/features" class="nav_links">Features</a>
                <a href="/pricing" class="nav_links">Pricing</a>
                <a href="/blog" class="nav_links">Blog</a>
              </div>
            </nav>
          </div>

          <div class="nav_buttons-wrap is-desktop-only">
            <div class="login-wrap">
              <a href="/contact" class="button is-primary">
                <div class="button-text-wrap">
                  <div class="button-text is-first">Contact</div>
                  <div class="button-text is-second">Contact</div>
                  <div class="button-shadow-up"></div>
                  <div class="button-shadow-down"></div>
                </div>
                <svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </a>
            </div>
          </div>

          <!-- OSMO hamburger anchor — relative 2.75em × 2.75em flex child -->
          <div class="hamburger-anchor is-mobile-only">
            <div class="hamburger-nav">
              <div class="hamburger-nav__bg" aria-hidden="true"></div>
              <div class="hamburger-nav__group">
                <p class="hamburger-nav__menu-p">Menu</p>
                <ul class="hamburger-nav__ul">
                  <li class="hamburger-nav__li">
                    <a href="/about" class="hamburger-nav__a">
                      <p class="hamburger-nav__p">About</p>
                      <div class="hamburger-nav__dot" aria-hidden="true"></div>
                    </a>
                  </li>
                  <li class="hamburger-nav__li">
                    <a href="/features" class="hamburger-nav__a">
                      <p class="hamburger-nav__p">Features</p>
                      <div class="hamburger-nav__dot" aria-hidden="true"></div>
                    </a>
                  </li>
                  <li class="hamburger-nav__li">
                    <a href="/pricing" class="hamburger-nav__a">
                      <p class="hamburger-nav__p">Pricing</p>
                      <div class="hamburger-nav__dot" aria-hidden="true"></div>
                    </a>
                  </li>
                  <li class="hamburger-nav__li">
                    <a href="/blog" class="hamburger-nav__a">
                      <p class="hamburger-nav__p">Blog</p>
                      <div class="hamburger-nav__dot" aria-hidden="true"></div>
                    </a>
                  </li>
                  <li class="hamburger-nav__li">
                    <a href="/contact" class="hamburger-nav__a">
                      <p class="hamburger-nav__p">Contact</p>
                      <div class="hamburger-nav__dot" aria-hidden="true"></div>
                    </a>
                  </li>
                </ul>
              </div>
              <button type="button" data-navigation-toggle="toggle" aria-label="Toggle menu" aria-expanded="false" class="hamburger-nav__toggle">
                <div class="hamburger-nav__toggle-bar"></div>
                <div class="hamburger-nav__toggle-bar"></div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
  // Advisora OSMO-style scaling-hamburger navigation (tablet + mobile only).
  // State tracked via `data-navigation-status` on <html>.
  (function () {
    function init() {
      var html = document.documentElement;
      var toggleEls = document.querySelectorAll('[data-navigation-toggle="toggle"]');
      var closeEls = document.querySelectorAll('[data-navigation-toggle="close"]');
      var menuLinks = document.querySelectorAll(".hamburger-nav__a");

      function setStatus(active) {
        html.setAttribute("data-navigation-status", active ? "active" : "not-active");
        html.style.overflow = active ? "hidden" : "";
        toggleEls.forEach(function (el) { el.setAttribute("aria-expanded", String(active)); });
      }

      setStatus(false);

      toggleEls.forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          setStatus(html.getAttribute("data-navigation-status") !== "active");
        });
      });

      closeEls.forEach(function (el) {
        el.addEventListener("click", function () { setStatus(false); });
      });

      menuLinks.forEach(function (link) {
        link.addEventListener("click", function () { setStatus(false); });
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && html.getAttribute("data-navigation-status") === "active") {
          setStatus(false);
        }
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
